<!doctype html><html lang="pt-MZ"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajuda · Academia Digital do INS</title><body><main style="max-width:700px;margin:50px auto;padding:24px;font:18px/1.6 Arial;color:#174b5c"><h1>Ajuda da Academia</h1><p>Abra a Academia para consultar o guia correspondente ao seu perfil.</p><a id="open-help" href="./index.html#ajuda">Abrir o meu guia</a></main><script>var q=new URLSearchParams(location.search),keep=new URLSearchParams();for(var k of ['testadores','administracao','gestao','validacao'])if(q.get(k)==='1')keep.set(k,'1');if(q.get('perfil')==='participante')keep.set('perfil','participante');try{var saved=JSON.parse(localStorage.getItem('ins-platform-validation-session-v1')||'null');if(saved&&saved.expires>Date.now())keep.set('testadores','1');else {var administrator=JSON.parse(sessionStorage.getItem('ins-academia-administration-session-v1')||'null');if(administrator&&administrator.expires>Date.now()||/^[a-f0-9]{64}$/.test(sessionStorage.getItem('ins-ologatecnica-access-v1')||''))keep.set('administracao','1');}}catch{}var u='./index.html'+(keep.toString()?'?'+keep:'')+'#ajuda';document.getElementById('open-help').href=u;location.replace(u);</script></body></html>
